version: v1.0
name: sanitize-repro
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: repro
    task:
      env_vars:
        - name: REPRO_MARKER
          value: findme-12345
      jobs:
        - name: hold
          commands:
            - echo "$SEMAPHORE_JOB_ID"
            - sleep 9000
